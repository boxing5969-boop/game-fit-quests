<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>마이복서153 - 복싱 레벨업</title>
    <meta name="description" content="153복싱짐 회원을 위한 복싱 성장 퀘스트 앱">

    <!-- 링크 미리보기 (카카오톡·RCS문자·iMessage·SNS 공유 시 이미지+제목 표시).
         SPA 라 모든 경로가 이 index.html 을 응답 → 앱 링크·VIP 메시지 링크 전부 적용.
         og:image 는 절대 URL 필수. 이미지 교체 시 카카오는 캐시가 남으니
         https://developers.kakao.com/tool/debugger/sharing 에서 '초기화' 필요. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="마이복서153" />
    <meta property="og:title" content="마이복서153 — 복싱 레벨업" />
    <meta property="og:description" content="153복싱짐 회원 전용 복싱 성장 퀘스트 · 출석부터 랭크업까지" />
    <meta property="og:url" content="https://game-fit-quests.pages.dev/" />
    <meta property="og:image" content="https://game-fit-quests.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="마이복서153 — 복싱 레벨업" />
    <meta name="twitter:description" content="153복싱짐 회원 전용 복싱 성장 퀘스트 · 출석부터 랭크업까지" />
    <meta name="twitter:image" content="https://game-fit-quests.pages.dev/og-image.png" />

    <!-- 신 MY BOXER 로고 — favicon / app icon (2026-05).
         SVG 우선: 모던 브라우저 (Chrome/Firefox/Safari/Edge) 에서 모든 해상도
         선명. PNG 는 iOS Safari home-screen / 구브라우저 fallback. -->
    <link rel="icon" type="image/svg+xml" href="/myboxer-icon.svg" />
    <link rel="icon" type="image/png" href="/myboxer-icon.png" />
    <link rel="apple-touch-icon" href="/myboxer-icon.png" />
    <link rel="shortcut icon" type="image/png" href="/myboxer-icon.png" />
    <!-- PWA: manifest + 설치 가능 — Android Chrome 은 beforeinstallprompt, iOS Safari 는 '홈 화면에 추가' 안내. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="마이복서153" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="마이복서153" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Match the dark-first palette so mobile browser chrome and native
         scrollbars/form controls render dark instead of forced light. -->
    <meta name="theme-color" content="#0B0F17" />
    <meta name="color-scheme" content="dark light" />

    <!-- Warm up Supabase (data) and jsDelivr/Google Fonts (static assets)
         TCP+TLS so the first API call and the font paint both skip a
         round trip. -->
    <link rel="preconnect" href="https://whnczhxyjmyywhlfbgsd.supabase.co" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&display=swap"
    />

    <!-- (옛 Lovable 잔재 OG 태그 제거됨 — 상단의 공식 OG 태그가 유일본.
         중복 시 카카오 크롤러가 마지막 태그를 읽어 옛 이미지가 노출됐었음.) -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- PWA service worker 등록 — production 만. 실패해도 앱은 정상 동작. -->
    <script>
      if ("serviceWorker" in navigator && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {
            /* sw 등록 실패는 무시 — 설치 가능 상태만 못 됨 */
          });
        });
      }
    </script>
  </body>
</html>
