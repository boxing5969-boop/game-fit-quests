<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 450" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="위: 정면에서 치면 상대는 정면 가드만 유지하면 된다. 아래: 옆으로 스텝해 각을 열면 가드가 향하지 않은 옆구리가 열린다."><defs><marker id="a-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker><marker id="a-s" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3, #8A968E)"/></marker></defs>
<text x="230" y="24" fill="var(--ink-3, #8A968E)" font-size="13"
    font-weight="700" text-anchor="middle">정면 — 상대는 정면만 막으면 된다</text>
<circle cx="230" cy="80" r="22" fill="none" stroke="var(--gold, #C08A2E)" stroke-width="2.2"/>
<path d="M217,98 A22,22 0 0 0 243,98" fill="none" stroke="var(--gold, #C08A2E)" stroke-width="5"/>
<text x="230" y="48" fill="var(--gold, #C08A2E)" font-size="11"
    font-weight="500" text-anchor="middle">가드는 정면</text>
<circle cx="230" cy="170" r="20" fill="none" stroke="var(--ink, #E9EEEA)" stroke-width="2.4"/>
<line x1="230" y1="148" x2="230" y2="110" stroke="var(--ink-3, #8A968E)" stroke-width="2.8" marker-end="url(#a-s)"/>
<text x="250" y="130" fill="var(--ink-3, #8A968E)" font-size="11"
    font-weight="500" text-anchor="start">가드에 그대로 막힌다</text>
<text x="230" y="206" fill="var(--ink, #E9EEEA)" font-size="11"
    font-weight="500" text-anchor="middle">나</text>
<line x1="24" y1="232" x2="436" y2="232" stroke="var(--ink-3, #8A968E)" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>
<text x="230" y="268" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="middle">각을 열면 — 못 막는다</text>
<circle cx="164" cy="324" r="22" fill="none" stroke="var(--gold, #C08A2E)" stroke-width="2.2"/>
<path d="M151,342 A22,22 0 0 0 177,342" fill="none" stroke="var(--gold, #C08A2E)" stroke-width="5"/>
<text x="164" y="296" fill="var(--gold, #C08A2E)" font-size="11"
    font-weight="500" text-anchor="middle">가드는 정면 그대로</text>
<circle cx="164" cy="400" r="20" fill="none" stroke="var(--ink-3, #8A968E)" stroke-width="1.8" stroke-dasharray="4 4"/>
<circle cx="322" cy="340" r="20" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.6"/>
<path d="M186,406 Q276,414 306,362" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.4" marker-end="url(#a-m)"/>
<text x="240" y="436" fill="var(--mint, #15B88A)" font-size="11"
    font-weight="500" text-anchor="middle">옆으로 스텝</text>
<line x1="300" y1="328" x2="188" y2="322" stroke="var(--mint, #15B88A)" stroke-width="3" marker-end="url(#a-m)"/>
<text x="300" y="302" fill="var(--mint, #15B88A)" font-size="11"
    font-weight="500" text-anchor="start">열린 옆구리</text></svg>
