<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 214" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="블루 타이틀매치는 레드 스파링의 안전 게이트로, 통과해야 접촉 스파링에 나갈 수 있다."><defs><marker id="g-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker><marker id="g-w" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--warn, #D2603A)"/></marker></defs>
<text x="230" y="24" fill="var(--ink, #E9EEEA)" font-size="13"
    font-weight="700" text-anchor="middle">레드 스파링으로 가는 문</text>
<rect x="20" y="56" width="110" height="64" rx="8" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.2"/>
<text x="75" y="84" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="700" text-anchor="middle">블루 L11–19</text>
<text x="75" y="104" fill="var(--ink-3, #8A968E)" font-size="11"
    font-weight="500" text-anchor="middle">전 기술</text>
<line x1="136" y1="88" x2="168" y2="88" stroke="var(--mint, #15B88A)" stroke-width="2.4" marker-end="url(#g-m)"/>
<rect x="174" y="46" width="110" height="84" rx="8" fill="none" stroke="var(--gold, #C08A2E)" stroke-width="2.8"/>
<text x="229" y="80" fill="var(--gold, #C08A2E)" font-size="17"
    font-weight="700" text-anchor="middle">L20</text>
<text x="229" y="100" fill="var(--gold, #C08A2E)" font-size="11"
    font-weight="500" text-anchor="middle">타이틀매치</text>
<text x="229" y="119" fill="var(--ink-3, #8A968E)" font-size="10.5"
    font-weight="500" text-anchor="middle">3분 영상</text>
<line x1="290" y1="70" x2="322" y2="70" stroke="var(--mint, #15B88A)" stroke-width="2.4" marker-end="url(#g-m)"/>
<text x="306" y="60" fill="var(--mint, #15B88A)" font-size="10.5"
    font-weight="500" text-anchor="middle">통과</text>
<rect x="328" y="48" width="112" height="48" rx="8" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.2"/>
<text x="384" y="68" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="700" text-anchor="middle">레드 L26</text>
<text x="384" y="86" fill="var(--mint, #15B88A)" font-size="10.5"
    font-weight="500" text-anchor="middle">라이트 스파링</text>
<line x1="290" y1="112" x2="322" y2="112" stroke="var(--warn, #D2603A)" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#g-w)"/>
<text x="306" y="132" fill="var(--warn, #D2603A)" font-size="10.5"
    font-weight="500" text-anchor="middle">보완</text>
<rect x="328" y="106" width="112" height="40" rx="8" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="384" y="131" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">재제출</text>
<text x="230" y="172" fill="var(--ink-3, #8A968E)" font-size="11.5"
    font-weight="500" text-anchor="middle">블루 전 기술을 영상으로 증명해야 통과입니다</text>
<text x="230" y="196" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">통과 못 한 회원을 접촉 스파링에 내보내면 다칩니다</text></svg>
