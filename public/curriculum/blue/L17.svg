<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="위: 피하고 멈춘 뒤 치면 세 박자가 걸려 늦는다. 아래: 피하면서 동시에 치면 한 박자로 끝난다."><defs><marker id="x-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker></defs>
<text x="230" y="24" fill="var(--warn, #D2603A)" font-size="13"
    font-weight="700" text-anchor="middle">× 피하고 → 멈추고 → 친다</text>
<line x1="60" y1="80" x2="400" y2="80" stroke="var(--ink-3, #8A968E)" stroke-width="1.4" opacity=".6"/>

<circle cx="110" cy="80" r="14" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.4"/>
<text x="110" y="85" fill="var(--warn, #D2603A)" font-size="12"
    font-weight="700" text-anchor="middle">1</text>
<text x="110" y="112" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">피함</text>
<circle cx="230" cy="80" r="14" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.4"/>
<text x="230" y="85" fill="var(--warn, #D2603A)" font-size="12"
    font-weight="700" text-anchor="middle">2</text>
<text x="230" y="112" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">멈춤</text>
<circle cx="350" cy="80" r="14" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.4"/>
<text x="350" y="85" fill="var(--warn, #D2603A)" font-size="12"
    font-weight="700" text-anchor="middle">3</text>
<text x="350" y="112" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">침</text>
<text x="230" y="140" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">세 박자 — 그 사이 상대가 다음 방을 던진다</text>
<line x1="24" y1="166" x2="436" y2="166" stroke="var(--ink-3, #8A968E)" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>
<text x="230" y="202" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="middle">○ 피하면서 동시에 친다</text>
<line x1="60" y1="258" x2="400" y2="258" stroke="var(--ink-3, #8A968E)" stroke-width="1.4" opacity=".6"/>
<circle cx="110" cy="258" r="18" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.8"/>
<text x="110" y="264" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="middle">1</text>
<text x="110" y="292" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="600" text-anchor="middle">피함 + 침</text>
<line x1="136" y1="240" x2="386" y2="240" stroke="var(--mint, #15B88A)" stroke-width="3" marker-end="url(#x-m)"/>
<text x="270" y="228" fill="var(--mint, #15B88A)" font-size="11"
    font-weight="500" text-anchor="middle">반격</text>
<text x="272" y="292" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="500" text-anchor="middle">상대는 아직 팔을 뻗은 상태</text>
<text x="230" y="314" fill="var(--mint, #15B88A)" font-size="12"
    font-weight="700" text-anchor="middle">한 박자로 끝난다</text></svg>
