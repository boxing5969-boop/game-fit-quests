<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 264" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="옆에서 감아 들어오는 훅은 옆으로 피할 수 없고, 머리가 U자를 그리며 훅 궤도 아래로 지나 반대편으로 나온다."><defs><marker id="w-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker><marker id="w-g" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--gold, #C08A2E)"/></marker></defs>
<text x="230" y="24" fill="var(--ink, #E9EEEA)" font-size="12.5"
    font-weight="700" text-anchor="middle">훅은 옆으로 못 피한다 — 밑으로 지나간다</text>
<path d="M40,116 Q186,46 344,100" fill="none" stroke="var(--gold, #C08A2E)" stroke-width="3" marker-end="url(#w-g)"/>
<text x="40" y="100" fill="var(--gold, #C08A2E)" font-size="11"
    font-weight="500" text-anchor="start">상대 훅</text>
<path d="M142,144 Q212,240 282,148" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#w-m)"/>
<circle cx="142" cy="124" r="18" fill="none" stroke="var(--ink-3, #8A968E)" stroke-width="1.8" stroke-dasharray="4 4"/>
<circle cx="282" cy="124" r="18" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.6"/>
<text x="112" y="128" fill="var(--ink-3, #8A968E)" font-size="11"
    font-weight="500" text-anchor="end">시작</text>
<text x="308" y="128" fill="var(--mint, #15B88A)" font-size="11"
    font-weight="500" text-anchor="start">나온 자리</text>
<text x="230" y="218" fill="var(--mint, #15B88A)" font-size="12"
    font-weight="700" text-anchor="middle">U자로 훅 밑을 지나 반대편으로 나온다</text>
<text x="230" y="242" fill="var(--ink-3, #8A968E)" font-size="11.5"
    font-weight="500" text-anchor="middle">허리가 아니라 무릎으로 내려가고, 등은 세운 채</text></svg>
