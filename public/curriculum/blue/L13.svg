<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 442" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="위: 무릎을 굽혀 낮추면 등이 세워지고 시선이 유지된다. 아래: 허리를 접어 숙이면 시선을 잃고 허리에 부담이 간다."><defs><marker id="b-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker><marker id="b-w" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--warn, #D2603A)"/></marker></defs>
<text x="230" y="24" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="middle">○ 무릎을 굽혀 낮춘다</text>
<line x1="30" y1="180" x2="430" y2="180" stroke="var(--ink-3, #8A968E)" stroke-width="1.2" opacity=".55"/>
<g stroke="var(--mint, #15B88A)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="152" cy="80" r="15"/><path d="M152,95 L152,130"/>
  <path d="M152,130 L130,156 L130,180 M152,130 L174,156 L174,180"/>
  <path d="M152,106 L206,112"/></g>
<circle cx="216" cy="113" r="8" fill="var(--mint, #15B88A)"/>
<line x1="168" y1="72" x2="204" y2="68" stroke="var(--mint, #15B88A)" stroke-width="2" marker-end="url(#b-m)"/>
<text x="212" y="66" fill="var(--mint, #15B88A)" font-size="11"
    font-weight="500" text-anchor="start">시선 유지</text>
<line x1="118" y1="100" x2="140" y2="106" stroke="var(--ink-3, #8A968E)" stroke-width="1.2"/>
<text x="112" y="104" fill="var(--ink-3, #8A968E)" font-size="11"
    font-weight="500" text-anchor="end">등이 세워짐</text>
<text x="230" y="206" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="500" text-anchor="middle">무릎으로 낮추니 시선과 자세가 유지된다</text>
<line x1="24" y1="232" x2="436" y2="232" stroke="var(--ink-3, #8A968E)" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>
<text x="230" y="270" fill="var(--warn, #D2603A)" font-size="13"
    font-weight="700" text-anchor="middle">× 허리를 접는다</text>
<line x1="30" y1="404" x2="430" y2="404" stroke="var(--ink-3, #8A968E)" stroke-width="1.2" opacity=".55"/>
<g stroke="var(--warn, #D2603A)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="238" cy="356" r="15"/><path d="M224,346 L168,312"/>
  <path d="M168,312 L150,404 M168,312 L186,404"/></g>
<line x1="250" y1="370" x2="274" y2="394" stroke="var(--warn, #D2603A)" stroke-width="2" marker-end="url(#b-w)"/>
<text x="282" y="398" fill="var(--warn, #D2603A)" font-size="11"
    font-weight="500" text-anchor="start">시선이 바닥</text>
<path d="M156,302 A15,15 0 0 0 152,326" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.4"/>
<text x="144" y="310" fill="var(--warn, #D2603A)" font-size="11"
    font-weight="500" text-anchor="end">허리 부담</text>
<text x="230" y="430" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">시선을 잃고 허리에 부담이 쌓인다</text></svg>
