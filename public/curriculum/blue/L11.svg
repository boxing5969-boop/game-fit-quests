<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 452" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="위에서 본 그림. 위: 앞발 뒤꿈치가 안쪽으로 비틀리며 그 회전이 훅의 호를 만든다. 아래: 발이 돌지 않으면 팔만 휘두르게 된다."><defs><marker id="h-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker><marker id="h-w" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--warn, #D2603A)"/></marker></defs>
<text x="230" y="24" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="middle">○ 앞발이 돌면 주먹이 나간다</text>
<text x="24" y="44" fill="var(--ink-3, #8A968E)" font-size="10.5"
    font-weight="500" text-anchor="start">위에서 내려다본 모습</text>
<circle cx="186" cy="98" r="18" fill="none" stroke="var(--ink, #E9EEEA)" stroke-width="2.4"/>
<path d="M168,100 Q140,58 202,52" fill="none" stroke="var(--mint, #15B88A)" stroke-width="3.4" stroke-linecap="round" marker-end="url(#h-m)"/>
<text x="214" y="50" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="start">훅</text>
<ellipse cx="160" cy="156" rx="14" ry="21" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.6"/>
<ellipse cx="224" cy="156" rx="14" ry="21" fill="none" stroke="var(--ink-3, #8A968E)" stroke-width="2.2"/>
<path d="M174,170 Q194,164 190,144" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.2" marker-end="url(#h-m)"/>
<text x="160" y="196" fill="var(--mint, #15B88A)" font-size="11"
    font-weight="500" text-anchor="middle">앞발</text>
<text x="232" y="196" fill="var(--ink-3, #8A968E)" font-size="11"
    font-weight="500" text-anchor="middle">뒷발 고정</text>
<text x="230" y="222" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="500" text-anchor="middle">앞발 뒤꿈치가 비틀리며 그 회전이 주먹을 밀어낸다</text>
<line x1="24" y1="248" x2="436" y2="248" stroke="var(--ink-3, #8A968E)" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>
<text x="230" y="286" fill="var(--warn, #D2603A)" font-size="13"
    font-weight="700" text-anchor="middle">× 발이 안 돌면 팔만 휘두른다</text>
<circle cx="186" cy="340" r="18" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.2"/>
<path d="M168,342 Q146,312 188,306" fill="none" stroke="var(--warn, #D2603A)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
<ellipse cx="160" cy="382" rx="14" ry="21" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.2" stroke-dasharray="4 4"/>
<ellipse cx="224" cy="382" rx="14" ry="21" fill="none" stroke="var(--ink-3, #8A968E)" stroke-width="2.2"/>
<text x="158" y="420" fill="var(--warn, #D2603A)" font-size="11"
    font-weight="500" text-anchor="middle">앞발 안 돎</text>
<text x="232" y="420" fill="var(--ink-3, #8A968E)" font-size="11"
    font-weight="500" text-anchor="middle">뒷발</text>
<text x="230" y="444" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">팔 힘만 실려 훅이 아니라 그냥 휘두름이 된다</text></svg>
