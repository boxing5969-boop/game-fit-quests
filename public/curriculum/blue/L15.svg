<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 264" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="정면에서 본 그림. 직선 펀치가 중앙선으로 들어올 때 발은 그대로 두고 머리만 중앙선 밖으로 옮긴다."><defs><marker id="s-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker><marker id="s-g" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--gold, #C08A2E)"/></marker></defs>
<text x="230" y="24" fill="var(--ink, #E9EEEA)" font-size="13"
    font-weight="700" text-anchor="middle">발은 그대로, 머리만 중앙선 밖으로</text>
<line x1="210" y1="44" x2="210" y2="196" stroke="var(--ink-3, #8A968E)" stroke-width="1.3" stroke-dasharray="5 5" opacity=".7"/>
<text x="218" y="54" fill="var(--ink-3, #8A968E)" font-size="11"
    font-weight="500" text-anchor="start">중앙선</text>
<line x1="46" y1="112" x2="240" y2="112" stroke="var(--gold, #C08A2E)" stroke-width="3" marker-end="url(#s-g)"/>
<text x="46" y="98" fill="var(--gold, #C08A2E)" font-size="11"
    font-weight="500" text-anchor="start">상대 직선</text>
<circle cx="210" cy="112" r="20" fill="none" stroke="var(--ink-3, #8A968E)" stroke-width="1.8" stroke-dasharray="4 4"/>
<circle cx="286" cy="128" r="20" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.6"/>
<path d="M212,90 Q248,70 278,108" fill="none" stroke="var(--mint, #15B88A)" stroke-width="2.2" marker-end="url(#s-m)"/>
<text x="312" y="84" fill="var(--mint, #15B88A)" font-size="11"
    font-weight="500" text-anchor="start">머리만 옆으로</text>
<line x1="210" y1="132" x2="210" y2="168" stroke="var(--ink, #E9EEEA)" stroke-width="2.2" stroke-linecap="round"/>
<ellipse cx="188" cy="178" rx="14" ry="9" fill="none" stroke="var(--ink, #E9EEEA)" stroke-width="2.2"/>
<ellipse cx="232" cy="178" rx="14" ry="9" fill="none" stroke="var(--ink, #E9EEEA)" stroke-width="2.2"/>
<rect x="166" y="164" width="88" height="28" rx="6" fill="none" stroke="var(--mint, #15B88A)" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="210" y="218" fill="var(--mint, #15B88A)" font-size="12"
    font-weight="700" text-anchor="middle">발은 움직이지 않는다</text>
<text x="230" y="244" fill="var(--ink-3, #8A968E)" font-size="11.5"
    font-weight="500" text-anchor="middle">거리가 유지되니까 곧바로 되칠 수 있다</text></svg>
