<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" role="img" font-family="'IBM Plex Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif"
   aria-label="옆에서 본 그림. 무릎을 굽혔다 펴는 힘이 골반을 거쳐 주먹을 위로 올린다. 다리를 쓰지 않고 팔만 들어올리면 어퍼컷이 올라가지 않는다."><defs><marker id="u-m" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--mint, #15B88A)"/></marker><marker id="u-w" viewBox="0 0 10 10" refX="9" refY="5"
   markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="var(--warn, #D2603A)"/></marker></defs>
<text x="230" y="24" fill="var(--ink, #E9EEEA)" font-size="12.5"
    font-weight="700" text-anchor="middle">옆에서 본 모습 — 무릎이 펴지며 주먹이 올라간다</text>
<line x1="24" y1="236" x2="436" y2="236" stroke="var(--ink-3, #8A968E)" stroke-width="1.2" opacity=".55"/>
<line x1="312" y1="92" x2="312" y2="246" stroke="var(--ink-3, #8A968E)" stroke-width="1" stroke-dasharray="4 6" opacity=".5"/>
<g stroke="var(--ink, #E9EEEA)" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="92" cy="128" r="14"/><path d="M92,142 L92,180"/>
  <path d="M92,180 L68,206 L70,236 M92,180 L116,206 L114,236"/></g>
<line x1="46" y1="150" x2="46" y2="200" stroke="var(--mint, #15B88A)" stroke-width="2.4" marker-end="url(#u-m)"/>
<text x="34" y="148" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="end">①</text>
<text x="92" y="260" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="500" text-anchor="middle">무릎을 굽힌다</text>
<g stroke="var(--ink, #E9EEEA)" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="230" cy="84" r="14"/><path d="M230,98 L230,150"/>
  <path d="M230,150 L218,194 L216,236 M230,150 L244,194 L246,236"/></g>
<line x1="190" y1="204" x2="190" y2="146" stroke="var(--mint, #15B88A)" stroke-width="2.4" marker-end="url(#u-m)"/>
<text x="178" y="204" fill="var(--mint, #15B88A)" font-size="13"
    font-weight="700" text-anchor="end">②</text>
<path d="M230,116 L252,126" fill="none" stroke="var(--ink, #E9EEEA)" stroke-width="2.3" stroke-linecap="round"/>
<circle cx="256" cy="128" r="7" fill="var(--mint, #15B88A)"/>
<line x1="256" y1="142" x2="256" y2="62" stroke="var(--mint, #15B88A)" stroke-width="3.4" stroke-linecap="round" marker-end="url(#u-m)"/>
<text x="270" y="60" fill="var(--mint, #15B88A)" font-size="12.5"
    font-weight="700" text-anchor="start">어퍼컷</text>
<text x="230" y="260" fill="var(--mint, #15B88A)" font-size="11.5"
    font-weight="500" text-anchor="middle">펴는 힘이 주먹까지</text>
<g stroke="var(--warn, #D2603A)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="376" cy="112" r="14"/><path d="M376,126 L376,182"/>
  <path d="M376,182 L366,236 M376,182 L388,236"/></g>
<path d="M376,142 L396,152" fill="none" stroke="var(--warn, #D2603A)" stroke-width="2.2" stroke-linecap="round"/>
<line x1="400" y1="150" x2="400" y2="106" stroke="var(--warn, #D2603A)" stroke-width="2.4" stroke-dasharray="5 4" stroke-linecap="round" marker-end="url(#u-w)"/>
<text x="376" y="260" fill="var(--warn, #D2603A)" font-size="11.5"
    font-weight="500" text-anchor="middle">팔만 들어올림</text>
<text x="230" y="284" fill="var(--ink-3, #8A968E)" font-size="11.5"
    font-weight="500" text-anchor="middle">다리를 쓰지 않으면 어퍼컷은 아예 올라가지 않는다</text></svg>
