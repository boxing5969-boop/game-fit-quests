<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="MY BOXER 153">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(45,212,191,0.18)"/>
      <stop offset="100%" stop-color="rgba(45,212,191,0.02)"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="#0B0F17"/>
  <rect x="28" y="28" width="200" height="200" rx="44"
        fill="url(#bgGrad)" stroke="#2dd4bf" stroke-width="8"
        filter="url(#glow)"/>
  <rect x="48" y="48" width="160" height="160" rx="32"
        fill="none" stroke="rgba(45,212,191,0.55)" stroke-width="2"/>

  <text x="128" y="158" text-anchor="middle"
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif"
        font-size="92" font-weight="900" letter-spacing="-4"
        fill="white" filter="url(#glow)">M3</text>

  <text x="128" y="208" text-anchor="middle"
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="800" letter-spacing="6"
        fill="#2dd4bf">153</text>
